name: market

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    # PR 与 push 都跑：结构 / 命名 / 元数据 / 体积 / 格式的机械校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验脚本大文件夹
        run: node tools/build-index.mjs --check
      # 设计工具（studio/）：快照结构、引用完整性、不许泄本地路径
      # ⚠️ 这里查不了"快照是否与私有的 App 仓库同步"——CI 读不到那个仓库，
      #    那条靠本地 `node tools/sync-studio-assets.mjs --check` 与界面上的来源版本号。
      - name: studio 完整性检查
        run: node tools/check-studio.mjs
      - name: studio 语义层自测（62 项，组件库走快照）
        run: node studio/test-engine.js

  build-index:
    # 只有 main 上的 push 才重建索引并回提交；索引内容没变时不产生 diff
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 重建 scripts.json
        run: node tools/build-index.mjs
      - name: 回提交（有变化才提交）
        run: |
          if git diff --quiet -- scripts.json; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add scripts.json
          git commit -m "chore: 重建市场索引 [skip ci]"
          git push
